# Supabase pauses free projects after about a week without activity.
# This runs a small read query every day so the database stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch:         # "Run workflow" button for testing

permissions:
  contents: read
  actions: write             # lets the last step re-enable this workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the database
        run: |
          url=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          key=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::notice::config.js has no Supabase settings yet (demo mode); nothing to ping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "${url%/}/rest/v1/rpc/list_filled" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Database responded."

      # GitHub turns off scheduled workflows in repos with no activity for 60 days.
      # Re-enabling it each run keeps the daily schedule going between seasons.
      - name: Keep this schedule from being turned off
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
