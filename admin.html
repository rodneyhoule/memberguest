<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Admin</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css?v=20261119">
  <script>
    // Set the theme before first paint: saved choice, else the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem("mmg-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body class="admin">
  <header class="site-header">
    <div class="wrap">
      <div class="header-top">
        <p class="eyebrow">Volunteer Admin</p>
        <button type="button" class="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="knob" aria-hidden="true"></span>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
      <h1 id="event-title">Men's Member/Guest Tournament</h1>
      <p class="dates" id="event-dates"></p>
    </div>
  </header>

  <div id="demo-banner" class="demo-banner" hidden>
    Demo mode: uses the demo sign-ups saved in this browser. The passcode is <strong>demo</strong>.
  </div>

  <main class="wrap">
    <!-- Passcode -->
    <section id="view-login">
      <h2>Admin sign-in</h2>
      <form id="login-form" novalidate>
        <label>Admin passcode
          <input name="code" type="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="btn primary big">Sign in</button>
      </form>
    </section>

    <!-- Roster -->
    <section id="view-roster" hidden>
      <div class="admin-bar">
        <span id="totals"></span>
        <span class="admin-actions">
          <button type="button" class="btn" id="btn-refresh">Refresh</button>
          <button type="button" class="btn" id="btn-csv">Download CSV</button>
          <button type="button" class="btn" id="btn-print">Print schedule</button>
          <button type="button" class="link" id="btn-logout">Sign out</button>
        </span>
      </div>
      <p class="error" id="roster-error" role="alert" hidden></p>
      <nav class="day-tabs" role="tablist" id="day-tabs"></nav>
      <div id="roles"></div>
    </section>

    <!-- Print-only roster, all days -->
    <section id="print-roster" class="print-only"></section>
  </main>

  <!-- Move dialog -->
  <dialog id="move-dialog">
    <form method="dialog" id="move-form">
      <h2 id="move-title">Move</h2>
      <p id="move-from" class="small"></p>
      <label>Move to
        <select name="shift" id="move-select" required></select>
      </label>
      <p class="error" id="move-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="move-submit">Move</button>
      </div>
    </form>
  </dialog>

  <!-- Print dialog -->
  <dialog id="print-dialog">
    <form method="dialog" id="print-form">
      <h2>Print schedule</h2>
      <fieldset class="choices">
        <legend>Days</legend>
        <div id="print-days"></div>
      </fieldset>
      <fieldset class="choices">
        <legend>Layout</legend>
        <label class="choice"><input type="radio" name="layout" value="shift" checked>
          <span>By shift, like last year's sheet (one page per day)</span></label>
        <label class="choice"><input type="radio" name="layout" value="person">
          <span>By volunteer, A–Z (for check-in)</span></label>
      </fieldset>
      <fieldset class="choices">
        <legend>Include</legend>
        <label class="choice"><input type="checkbox" name="phones" checked>
          <span>Volunteer phone numbers (uncheck for a copy to post publicly)</span></label>
      </fieldset>
      <p class="error" id="print-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Print</button>
      </div>
    </form>
  </dialog>

  <!-- Add dialog -->
  <dialog id="add-dialog">
    <form method="dialog" id="add-form" novalidate>
      <h2>Add a volunteer</h2>
      <p id="add-to" class="small"></p>
      <div class="row">
        <label>First name <input name="firstName" required maxlength="40"></label>
        <label>Last name <input name="lastName" required maxlength="40"></label>
      </div>
      <label>Email <input name="email" type="email" required maxlength="100"></label>
      <label>Cell phone <input name="phone" type="tel" required maxlength="20"></label>
      <p class="error" id="add-error" role="alert" hidden></p>
      <div class="dialog-buttons">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="add-submit">Add</button>
      </div>
    </form>
  </dialog>

  <script src="theme.js?v=20261119"></script>
  <script src="config.js?v=20261119"></script>
  <script src="admin.js?v=20261119"></script>
</body>
</html>
